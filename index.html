    margin: 0;

<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">🎀</div>
        <div>
            <h1>Reminder Tugas</h1>
            <p>Catat tugasmu dan jangan lupa deadline</p>
        </div>
    </div>
</header>

<div class="container">

<div class="top-section">

    <div class="card">
        <div class="card-title">
            <span>📝</span>
            <h2>Tambah Tugas</h2>
        </div>

        <label>Mata Pelajaran</label>
        <input type="text" id="mapel" placeholder="Contoh: Matematika">

        <label>Nama Tugas</label>
        <input type="text" id="namaTugas" placeholder="Contoh: Latihan soal">

        <label>Deadline</label>
        <input type="date" id="deadline">

        <button class="btn-tambah" onclick="tambahTugas()">
            💗 Simpan Tugas
        </button>
    </div>

    <div class="card reminder-card">
        <div class="card-title">
            <span>🔔</span>
            <h2>Pengingat</h2>
        </div>

        <div id="daftarPengingat">
            <div class="no-reminder">
                🌸 Belum ada pengingat tugas
            </div>
        </div>
    </div>

</div>

<div class="task-section">

    <div class="task-header">
        <h2>📚 Daftar Tugas</h2>
        <div class="task-count">TUGAS SAYA</div>
    </div>

    <div id="daftarTugas"></div>

</div>

<div class="stats">

    <div class="stat">
        <div class="stat-number" id="totalTugas">0</div>
        <div class="stat-title">Total Tugas</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="belumSelesai">0</div>
        <div class="stat-title">Belum Selesai</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="sudahSelesai">0</div>
        <div class="stat-title">Sudah Selesai</div>
    </div>

</div>

</div>

<script>

let tugas =
    JSON.parse(
        localStorage.getItem("studyPlanner")
    ) || [];

/* BUKA APLIKASI */
tampilkanTugas();
cekSemuaDeadline();

/* INPUT DAN SIMPAN TUGAS */
function tambahTugas() {

    let mapel =
        document.getElementById("mapel").value.trim();

    let nama =
        document.getElementById("namaTugas").value.trim();

    let deadline =
        document.getElementById("deadline").value;

    if (
        mapel === "" ||
        nama === "" ||
        deadline === ""
    ) {
        alert("Silakan lengkapi semua data tugas!");
        return;
    }

    let tugasBaru = {
        id: Date.now(),
        mapel: mapel,
        nama: nama,
        deadline: deadline,
        selesai: false
    };

    tugas.push(tugasBaru);

    simpanData();
    tampilkanTugas();
    cekSemuaDeadline();

    document.getElementById("mapel").value = "";
    document.getElementById("namaTugas").value = "";
    document.getElementById("deadline").value = "";
}

/* SIMPAN DATA */
function simpanData() {
    localStorage.setItem(
        "studyPlanner",
        JSON.stringify(tugas)
    );
}

/* TAMPILKAN DAFTAR TUGAS */
function tampilkanTugas() {

    let daftar =
        document.getElementById("daftarTugas");

    daftar.innerHTML = "";

    if (tugas.length === 0) {

        daftar.innerHTML = `
            <div class="empty">
                🎀 Belum ada tugas
                <br><br>
                Yuk tambahkan tugas sekolahmu
            </div>
        `;

        updateStatistik();
        return;
    }

    tugas.forEach(function(item) {

        let status = cekDeadline(item);

        let div = document.createElement("div");

        div.className = "task";

        if (item.selesai) {
            div.classList.add("completed");
        }

        div.innerHTML = `

            <div>

                <div class="task-name">
                    ${item.nama}
                </div>

                <div class="subject">
                    📖 ${item.mapel}
                </div>

                <div class="deadline">
                    📅 Deadline:
                    ${formatTanggal(item.deadline)}
                </div>

                <div class="status">
                    ${
                        item.selesai
                        ? "🌸 Tugas sudah selesai"
                        : status
                    }
                </div>

            </div>

            <div class="actions">

                ${
                    !item.selesai
                    ?
                    `
                    <button
                        class="btn btn-selesai"
                        onclick="selesaikanTugas(${item.id})">
                        ✓ Selesai
                    </button>
                    `
                    :
                    ""
                }

                <button
                    class="btn btn-hapus"
                    onclick="hapusTugas(${item.id})">
                    Hapus
                </button>

            </div>
        `;

        daftar.appendChild(div);
    });

    updateStatistik();
}

/* CEK DEADLINE */
function cekDeadline(item) {

    if (item.selesai) {
        return "🌸 Selesai";
    }

    let sekarang = new Date();

    sekarang.setHours(0, 0, 0, 0);

    let deadline =
        new Date(item.deadline + "T00:00:00");

    let selisih =
        deadline - sekarang;

    let hari =
        Math.ceil(
            selisih /
            (1000 * 60 * 60 * 24)
        );

    if (hari < 0) {
        return "⚠️ Deadline sudah lewat";
    }

    if (hari === 0) {
        return "💗 Deadline hari ini!";
    }

    if (hari === 1) {
        return "🌸 Deadline besok (H-1)";
    }

    if (hari === 3) {
        return "🎀 Deadline 3 hari lagi (H-3)";
    }

    return "🌼 " + hari + " hari lagi";
}

/* PENGINGAT */
function cekSemuaDeadline() {

    let tempat =
        document.getElementById("daftarPengingat");

    tempat.innerHTML = "";

    let adaPengingat = false;

    tugas.forEach(function(item) {

        if (item.selesai) {
            return;
        }

        let sekarang = new Date();

        sekarang.setHours(0, 0, 0, 0);

        let deadline =
            new Date(item.deadline + "T00:00:00");

        let selisih =
            deadline - sekarang;

        let hari =
            Math.ceil(
                selisih /
                (1000 * 60 * 60 * 24)
            );

        if (
            hari === 3 ||
            hari === 1 ||
            hari === 0
        ) {

            adaPengingat = true;

            let pesan = "";

            if (hari === 3) {
                pesan = "🎀 Deadline 3 hari lagi (H-3)";
            }
            else if (hari === 1) {
                pesan = "🌸 Deadline besok (H-1)";
            }
            else {
                pesan = "💗 Deadline hari ini!";
            }

            tempat.innerHTML += `
                <div class="reminder">
                    🔔
                    <strong>${item.nama}</strong>
                    <br>
                    📚 ${item.mapel}
                    <br>
                    ${pesan}
                </div>
            `;
        }
    });

    if (!adaPengingat) {

        tempat.innerHTML = `
            <div class="no-reminder">
                🌸 Belum ada tugas
                yang mendekati deadline
                <br><br>
                💗 Tetap semangat belajar
            </div>
        `;
    }
}

/* TUGAS SUDAH DIKUMPULKAN */
function selesaikanTugas(id) {

    tugas.forEach(function(item) {

        if (item.id === id) {
            item.selesai = true;
        }

    });

    simpanData();
    tampilkanTugas();
    cekSemuaDeadline();
}

/* HAPUS TUGAS */
function hapusTugas(id) {

    let yakin =
        confirm("Hapus tugas ini?");

    if (yakin) {

        tugas =
            tugas.filter(
                item => item.id !== id
            );

        simpanData();
        tampilkanTugas();
        cekSemuaDeadline();
    }
}

/* STATISTIK */
function updateStatistik() {

    let total = tugas.length;

    let selesai =
        tugas.filter(
            item => item.selesai
        ).length;

    let belum =
        total - selesai;

    document.getElementById(
        "totalTugas"
    ).textContent = total;

    document.getElementById(
        "belumSelesai"
    ).textContent = belum;

    document.getElementById(
        "sudahSelesai"
    ).textContent = selesai;
}

/* FORMAT TANGGAL */
function formatTanggal(tanggal) {

    let date =
        new Date(
            tanggal + "T00:00:00"
        );

    return date.toLocaleDateString(
        "id-ID",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}

/* CEK DEADLINE BERKALA */
setInterval(
    function() {
        cekSemuaDeadline();
        tampilkanTugas();
    },
    60 * 60 * 1000
);

</script>
